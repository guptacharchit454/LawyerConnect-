version: '3.8'

services:
  # Database Service
  postgres:
    image: postgres:15-alpine
    container_name: lc_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: lawyerconnect_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ashchit0321
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - lc_network

  # Redis Cache Service
  redis:
    image: redis:7-alpine
    container_name: lc_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - lc_network

  # Zookeeper Service (Required for Kafka coordination)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: lc_zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - lc_network

  # Kafka Message Broker Service
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: lc_kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Properly mapped listeners to support both local host development and container communications
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    networks:
      - lc_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  lc_network:
    name: lc_network
    driver: bridge
